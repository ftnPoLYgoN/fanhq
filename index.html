<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FanHQ – Dein zentrales Hub für alle Fußballvereine der 1. Bundesliga, 2. Bundesliga und 3. Liga. Offizielle Links, Fan-Community, Stadioninfos und mehr.">
  <title>FanHQ – Dein Fußball-Hub</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo" id="logo-home">
        <div class="logo-icon">⚽</div>
        <span>FanHQ</span>
      </div>
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <form id="search-form" onsubmit="return false;" style="margin:0; width:100%;">
          <input type="search" class="search-input" id="search-input" placeholder="Verein suchen…" autocomplete="off">
        </form>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main-content">
    <!-- Hero -->
    <section class="hero" id="hero-section">
      <h1>Alle Vereine. Ein Hub.</h1>
      <p>Offizielle Links, Fan-Community, Stadioninfos und Statistiken für 56 deutsche Profiklubs.</p>
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-number" id="stat-total">56</div>
          <div class="stat-label">Vereine</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">3</div>
          <div class="stat-label">Ligen</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="stat-sources">–</div>
          <div class="stat-label">Quellen</div>
        </div>
      </div>
    </section>

    <!-- Liga Tabs -->
    <div class="league-tabs" id="league-tabs">
      <button class="league-tab active" data-league="alle">Alle</button>
      <button class="league-tab" data-league="bundesliga">1. Bundesliga</button>
      <button class="league-tab" data-league="zweite-bundesliga">2. Bundesliga</button>
      <button class="league-tab" data-league="dritte-liga">3. Liga</button>
    </div>

    <!-- Club Grid -->
    <div id="club-grid" class="club-grid">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
  </main>

  <!-- Detail Overlay -->
  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-panel" id="detail-panel">
      <button class="detail-close" id="detail-close">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>FanHQ © 2026 · Daten: Saison 2025/26 · Kein offizielles DFL-Produkt</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
